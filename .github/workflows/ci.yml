name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies (Root)
      run: npm ci
      
    - name: Install dependencies (Client)
      run: cd client && npm ci
      
    - name: Build Frontend
      run: cd client && npm run build
      
    # If tests are added, they would run here
    # - name: Run tests
    #   run: npm test
